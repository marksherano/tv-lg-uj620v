<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pantalla</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #fff;
    font-family: "LG Smart UI", "Museo Sans", Arial, sans-serif; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .photo { background: #000 center / contain no-repeat; opacity: 0; -webkit-transition: opacity .8s; }
  .photo.on { opacity: 1; }
  video { width: 1920px; height: 1080px; background: #000; }
  .hidden { display: none !important; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 80px 36px;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,.85) 45%); -webkit-transition: opacity .3s; }
  #bar.off { opacity: 0; }
  #title { font-size: 34px; font-weight: bold; }
  #info { font-size: 24px; color: #c8c8d0; margin-top: 6px; }
  #prog { height: 8px; background: #44444f; border-radius: 4px; margin-top: 18px; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: #2f7df6; border-radius: 4px; }
  #help { font-size: 21px; color: #8a8a96; margin-top: 10px; }
  #msg { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-size: 36px; color: #c8c8d0; }
</style>
</head>
<body>
<div id="p0" class="layer photo"></div>
<div id="p1" class="layer photo"></div>
<video id="video" class="layer hidden" preload="auto"></video>
<div id="msg">Esperant contingut des del mòbil…</div>
<div id="bar" class="off">
  <div id="title"></div>
  <div id="info"></div>
  <div id="prog" class="hidden"><div id="fill"></div></div>
  <div id="help"></div>
</div>
<script src="app.js"></script>
</body>
</html>
